<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encode Companion Options</title>
  <style>
    body {
      background: #07080d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px;
      max-width: 500px;
      margin: 0 auto;
    }
    h2 { font-size: 18px; margin-bottom: 20px; color: #f59e0b; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: #94a3b8; }
    input {
      background: #131622;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 10px;
      color: #f8fafc;
      font-size: 13px;
    }
    input:focus { border-color: #f59e0b; outline: none; }
    small { color: #64748b; font-size: 11px; }
    button {
      background: #f59e0b;
      color: #07080d;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #d97706; }
    .status { margin-top: 10px; font-size: 12px; color: #10b981; }
  </style>
</head>
<body>
  <h2>Encode Companion Options</h2>
  <div class="form-group">
    <label for="gemini-key">Gemini API Key</label>
    <input type="password" id="gemini-key" placeholder="AIzaSy...">
    <small>Your key stays local in extension storage.</small>
  </div>
  <div class="form-group">
    <label for="default-deck">Default Anki Deck</label>
    <input type="text" id="default-deck" placeholder="DeepEncode::QuickCapture">
  </div>
  <div class="form-group">
    <label for="anki-url">AnkiConnect URL</label>
    <input type="text" id="anki-url" placeholder="http://127.0.0.1:8765">
  </div>
  <div class="form-group">
    <label for="deepencode-url">DeepEncode Studio URL</label>
    <input type="text" id="deepencode-url" placeholder="http://localhost:3000">
  </div>
  <button id="save-btn">Save Options</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
